<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Asynchronous actor throughput comparison</title>
  <desc id="desc">A12, A24, and A36 achieved 8.1613, 9.6780, and 9.5636 environment steps per second.</desc>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="70" y="54" font-family="sans-serif" font-size="26" font-weight="700" fill="#17212b">异步 actor 吞吐对比</text>
  <text x="70" y="83" font-family="sans-serif" font-size="16" fill="#53606c">相同 F8/G1、24-step horizon；A24 为资源与吞吐的最佳折中</text>
  <line x1="100" y1="390" x2="840" y2="390" stroke="#84909b" stroke-width="2"/>
  <line x1="100" y1="120" x2="100" y2="390" stroke="#84909b" stroke-width="2"/>
  <g font-family="sans-serif" font-size="14" fill="#53606c" text-anchor="end">
    <text x="90" y="395">0</text>
    <text x="90" y="341">2</text>
    <text x="90" y="287">4</text>
    <text x="90" y="233">6</text>
    <text x="90" y="179">8</text>
    <text x="90" y="125">10</text>
  </g>
  <g>
    <rect x="180" y="170" width="130" height="220" fill="#4f7cac" rx="4"/>
    <rect x="390" y="129" width="130" height="261" fill="#2b9a78" rx="4"/>
    <rect x="600" y="132" width="130" height="258" fill="#d68c45" rx="4"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="245" y="158" font-size="18" font-weight="700" fill="#17212b">8.1613</text>
    <text x="455" y="117" font-size="18" font-weight="700" fill="#17212b">9.6780</text>
    <text x="665" y="120" font-size="18" font-weight="700" fill="#17212b">9.5636</text>
    <text x="245" y="422" font-size="18" fill="#17212b">A12</text>
    <text x="455" y="422" font-size="18" font-weight="700" fill="#17684f">A24</text>
    <text x="665" y="422" font-size="18" fill="#17212b">A36</text>
    <text x="455" y="458" font-size="15" fill="#53606c">environment steps / second</text>
  </g>
</svg>
