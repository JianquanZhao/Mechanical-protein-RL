version: sft_smoke

split:
  cluster_method: exact
  fractions:
    train: 0.80
    validation: 0.10
    test: 0.10
  seed: 20260917

scan:
  repeat_seeds: [11, 23]
  num_shards: 2
  save_candidate_structures: true

statistics:
  confidence_level: 0.95
  bootstrap_samples: 200
  positive_noise_boundary: 0.0
  negative_noise_boundary: 0.0
  target_column: marginal_reward_scaled

