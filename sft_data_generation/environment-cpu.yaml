name: mprl-sft-data
channels:
  - https://conda.rosettacommons.org
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=2.0,<3
  - pandas>=2.2,<3
  - scipy>=1.10,<2
  # params/hbond_random_forest.joblib was serialized with this version.
  - scikit-learn=1.6.1
  - joblib>=1.4,<2
  - pyyaml>=6,<7
  - pyarrow>=15
  - tqdm>=4.66
  - mmseqs2
  - pyrosetta
  - pytest>=8
